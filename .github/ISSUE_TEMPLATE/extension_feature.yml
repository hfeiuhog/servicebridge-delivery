name: Extension feature request
description: Propose an improvement to this fork's extension.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Explain the task and the current limit. Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
